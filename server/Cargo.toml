[package]
name = "chatlibre-server"
version = "0.1.0"
edition = "2021"
authors = ["chatLibre Team"]
license = "AGPL-3.0-or-later"
description = "A privacy-first, federated relay server"
repository = "https://github.com/chatlibre/chatlibre"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
bs58 = "0.5"
futures-util = "0.3"
parking_lot = "0.12"
ring = "0.17"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
