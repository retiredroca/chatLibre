version: '3.8'

services:
  chatlibre:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: chatlibre
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - chatlibre-data:/data
    environment:
      - KEYFORGE_SERVER_NAME=${KEYFORGE_SERVER_NAME:-chatLibre Server}
      - KEYFORGE_DATA_DIR=/data
      - KEYFORGE_LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: chatlibre-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    depends_on:
      - chatlibre
    networks:
      - chatlibre-net

volumes:
  chatlibre-data:

networks:
  chatlibre-net:
    driver: bridge
